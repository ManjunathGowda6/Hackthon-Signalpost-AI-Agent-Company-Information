{% extends "base.html" %}
{% block title %}Search{% endblock %}
{% block content %}
<div class="search-hero">
    <h1>Search Norwegian Companies</h1>
    <p class="hero-subtitle">53,000+ companies across all sectors &bull; Real-time Brreg fallback &bull; <a href="/chat" class="accent-link">Try AI Chat →</a></p>
    <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search any company by name, org number, municipality, or industry..." autofocus>
        <button class="btn btn-primary" onclick="doSearch()">Search</button>
    </div>
    <div class="filter-row">
        <select id="sector-filter" onchange="doSearch()">
            <option value="">All Sectors</option>
        </select>
    </div>
</div>
<div class="results-info" id="results-info"></div>
<div class="table-wrap">
    <table class="data-table">
        <thead><tr>
            <th>Org Number</th><th>Company Name</th><th>Form</th>
            <th>Municipality</th><th>Employees</th><th>Sector</th><th>Status</th>
        </tr></thead>
        <tbody id="results-tbody"></tbody>
    </table>
</div>
<div class="pagination" id="pagination"></div>

<script>
const input = document.getElementById('search-input');
input.addEventListener('keyup', (e) => {
    if(e.key==='Enter') doSearch();
    clearTimeout(window._st);
    window._st = setTimeout(doSearch, 500);
});

fetch('/api/sectors').then(r=>r.json()).then(sectors => {
    const sel = document.getElementById('sector-filter');
    sectors.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.code;
        opt.textContent = `${s.name} (${s.count})`;
        sel.appendChild(opt);
    });
});

async function doSearch(page=1) {
    const q = input.value.trim();
    const sector = document.getElementById('sector-filter').value;
    const url = `/api/search?q=${encodeURIComponent(q)}&sector=${sector}&page=${page}&per_page=50`;
    const tbody = document.getElementById('results-tbody');
    tbody.innerHTML = '<tr><td colspan="7" class="muted" style="text-align:center;padding:2rem">Searching...</td></tr>';

    const data = await fetch(url).then(r => r.json());
    let info = `${data.total} results`;
    if (data.live_count > 0) info += ` (${data.local_count} local + ${data.live_count} live)`;
    document.getElementById('results-info').textContent = info;

    tbody.innerHTML = '';
    (data.items || []).forEach(p => {
        const badge = p.has_full_profile ? '<span class="tag-yes">Full Profile</span>'
            : (p.source === 'live' ? '<span class="badge" style="background:rgba(245,158,11,0.15);color:#f59e0b">Live</span>' : '<span class="tag-no">Basic</span>');
        tbody.innerHTML += `<tr onclick="location.href='/company/${p.organisation_number}'" class="clickable-row">
            <td><code>${p.organisation_number}</code></td>
            <td><strong>${p.name || '-'}</strong></td>
            <td><span class="badge">${p.legal_form || '-'}</span></td>
            <td>${p.municipality || '-'}</td>
            <td>${p.employees ? p.employees.toLocaleString() : '-'}</td>
            <td>${p.sector || '-'}</td>
            <td>${badge}</td></tr>`;
    });

    const pages = Math.ceil(data.total / 50);
    const pag = document.getElementById('pagination');
    pag.innerHTML = '';
    if (pages > 1) {
        for(let i=Math.max(1,page-3); i<=Math.min(pages,page+3); i++) {
            pag.innerHTML += `<button class="page-btn ${i===page?'active':''}" onclick="doSearch(${i})">${i}</button>`;
        }
    }
}
doSearch();
</script>
{% endblock %}
