<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signalpost AI</title>
    <meta name="description" content="Signalpost AI — Corporate Intelligence Chatbot">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/chat.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <button class="new-chat-btn" onclick="newChat()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    New chat
                </button>
            </div>
            <div class="sidebar-history" id="history-list"></div>
            <div class="sidebar-bottom">
                {% if user_email %}
                <div class="sidebar-user">
                    <div class="user-avatar" title="{{ user_name or user_email }}">{{ (user_name or user_email)[0].upper() }}</div>
                    <div class="user-details">
                        <span class="user-email-text" title="{{ user_email }}">{{ user_name or user_email }}</span>
                        <span class="user-status-text"><span class="status-dot"></span>Active</span>
                    </div>
                    <a href="/logout" class="logout-btn" title="Sign out">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </a>
                </div>
                {% endif %}
                <div class="sidebar-brand">&#9670; Signalpost AI</div>
            </div>
        </aside>

        <!-- Toggle -->
        <button class="sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

        <!-- Main Chat -->
        <main class="chat-main">
            <div class="chat-scroll" id="chat-scroll">
                <div class="welcome" id="welcome">
                    <div class="welcome-logo">&#9670;</div>
                    <h1>What company do you want to know about?</h1>
                    <p class="welcome-sub">Ask about any company — I'll find it instantly.</p>
                    <div class="suggestions">
                        <button onclick="ask('Tell me about OpenAI')"><span class="sg-icon">&#129302;</span><span>OpenAI</span></button>
                        <button onclick="ask('Tell me about NVIDIA')"><span class="sg-icon">&#128187;</span><span>NVIDIA</span></button>
                        <button onclick="ask('Tell me about TCS')"><span class="sg-icon">&#127970;</span><span>TCS</span></button>
                        <button onclick="ask('Tell me about Equinor')"><span class="sg-icon">&#9981;</span><span>Equinor</span></button>
                        <button onclick="ask('Tell me about Anthropic')"><span class="sg-icon">&#129504;</span><span>Anthropic</span></button>
                        <button onclick="ask('Show IT & Software sector')"><span class="sg-icon">&#128202;</span><span>IT Sector</span></button>
                    </div>
                </div>
                <div id="messages"></div>
            </div>

            <div class="input-area">
                <div class="input-box">
                    <div class="autocomplete-list" id="autocomplete"></div>
                    <textarea id="input" rows="1" placeholder="Ask about any company..." autofocus></textarea>
                    <button class="send" onclick="send()" id="sendBtn" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </div>
                <p class="input-hint">Handles typos and follow-ups. Try: "opn ai" or "tell me more"</p>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
    const input = document.getElementById('input');
    const msgEl = document.getElementById('messages');
    const scrollEl = document.getElementById('chat-scroll');
    const welcome = document.getElementById('welcome');
    const sendBtn = document.getElementById('sendBtn');
    const acList = document.getElementById('autocomplete');

    let lastCompany = '';
    let currentChatId = Date.now().toString();
    let chatMessages = [];

    // ── Textarea ──
    input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 150) + 'px';
        sendBtn.disabled = !input.value.trim();
        clearTimeout(window._ac);
        window._ac = setTimeout(doAC, 250);
    });
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        if (e.key === 'Escape') hideAC();
    });

    // ── Autocomplete ──
    async function doAC() {
        const q = input.value.trim();
        if (q.length < 2) { hideAC(); return; }
        try {
            const data = await fetch(`/api/suggest?q=${encodeURIComponent(q)}`).then(r=>r.json());
            if (!data.length) { hideAC(); return; }
            acList.innerHTML = '';
            data.forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'ac-item';
                btn.innerHTML = `<span>${s.type==='global'?'&#127758;':'&#127475;&#127476;'} <strong>${s.name}</strong></span><span class="ac-sub">${s.sub}</span>`;
                btn.onclick = () => { input.value = s.name; hideAC(); send(); };
                acList.appendChild(btn);
            });
            acList.style.display = 'block';
        } catch(e) { hideAC(); }
    }
    function hideAC() { acList.style.display = 'none'; }
    document.addEventListener('click', e => { if (!e.target.closest('.input-box')) hideAC(); });

    function ask(text) { input.value = text; send(); }

    // ── Typewriter effect ──
    function typeWriter(element, html, callback) {
        // Parse markdown first
        const rendered = marked.parse(html || '');
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = rendered;
        const fullText = tempDiv.innerHTML;

        // Show content progressively in chunks
        let idx = 0;
        const chunkSize = 8; // characters per tick
        const speed = 12; // ms per tick

        function addChunk() {
            if (idx < fullText.length) {
                // Find a safe split point (don't break HTML tags)
                let end = Math.min(idx + chunkSize, fullText.length);
                // If we're inside a tag, extend to close it
                let openBracket = fullText.lastIndexOf('<', end);
                let closeBracket = fullText.lastIndexOf('>', end);
                if (openBracket > closeBracket && end < fullText.length) {
                    end = fullText.indexOf('>', end);
                    if (end === -1) end = fullText.length;
                    else end += 1;
                }
                idx = end;
                element.innerHTML = fullText.substring(0, idx);
                scrollEl.scrollTop = scrollEl.scrollHeight;
                requestAnimationFrame(() => setTimeout(addChunk, speed));
            } else {
                element.innerHTML = fullText;
                element.classList.add('rendered');
                if (callback) callback();
            }
        }
        addChunk();
    }

    // ── Send message ──
    async function send() {
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        input.style.height = 'auto';
        sendBtn.disabled = true;
        hideAC();
        if (welcome) welcome.style.display = 'none';

        // User bubble
        addMsg('user', text);
        chatMessages.push({role:'user', text});
        scroll();

        // Bot typing indicator
        const botDiv = document.createElement('div');
        botDiv.className = 'msg msg-bot';
        botDiv.innerHTML = `<div class="msg-inner"><div class="bot-icon">&#9670;</div><div class="msg-content"><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div></div></div>`;
        msgEl.appendChild(botDiv);
        scroll();

        try {
            const resp = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: text, context: {last_company: lastCompany}}),
            });
            const data = await resp.json();
            const bubble = botDiv.querySelector('.msg-bubble');

            // Phase 1: Show database/initial info with typewriter effect
            typeWriter(bubble, data.reply || 'No response.', () => {
                if (data.company) lastCompany = data.company;

                // Phase 2: If needs_enrichment, fetch real-time data in parallel
                if (data.needs_enrichment && data.company) {
                    fetchEnrichment(data.company, text, bubble, data.reply || '');
                }

                chatMessages.push({role:'bot', text: data.reply || ''});
                saveChat(text);
            });
        } catch(err) {
            botDiv.querySelector('.msg-bubble').innerHTML = '&#10060; Connection error.';
        }
        scroll();
    }

    // ── Fetch real-time enrichment in parallel ──
    async function fetchEnrichment(company, query, bubble, baseReply) {
        // Show loading indicator for real-time data
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'enrich-loading';
        loadingDiv.innerHTML = '<div class="enrich-pulse"></div> Fetching latest real-time data...';
        bubble.parentElement.appendChild(loadingDiv);
        scroll();

        try {
            const resp = await fetch('/api/enrich', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({company, query}),
            });
            const data = await resp.json();
            loadingDiv.remove();

            if (data.enrichment && data.status === 'ok') {
                // Create enrichment section
                const enrichDiv = document.createElement('div');
                enrichDiv.className = 'msg-enrichment';
                bubble.parentElement.appendChild(enrichDiv);

                // Typewriter for enrichment
                typeWriter(enrichDiv, '\n---\n\n' + data.enrichment, () => {
                    // Update saved message with full content
                    const fullReply = baseReply + '\n\n---\n\n' + data.enrichment;
                    const lastBot = chatMessages.findLast(m => m.role === 'bot');
                    if (lastBot) lastBot.text = fullReply;
                    saveChat(query);
                });
                scroll();
            }
        } catch(e) {
            loadingDiv.remove();
        }
    }

    function addMsg(role, text) {
        const div = document.createElement('div');
        div.className = `msg msg-${role}`;
        if (role === 'user') {
            div.innerHTML = `<div class="msg-inner"><div class="msg-bubble">${esc(text)}</div></div>`;
        }
        msgEl.appendChild(div);
    }

    function scroll() { setTimeout(() => scrollEl.scrollTop = scrollEl.scrollHeight, 50); }
    function esc(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

    // ── Chat History ──
    function saveChat(firstMsg) {
        const chats = JSON.parse(localStorage.getItem('sp_chats') || '[]');
        const existing = chats.find(c => String(c.id) === String(currentChatId));
        if (existing) {
            existing.updated = Date.now();
            existing.count = chatMessages.length;
            existing.messages = chatMessages;
            existing.lastCompany = lastCompany;
        } else {
            chats.unshift({
                id: String(currentChatId),
                title: firstMsg.substring(0, 40),
                created: Date.now(),
                updated: Date.now(),
                count: chatMessages.length,
                messages: chatMessages,
                lastCompany: lastCompany
            });
        }
        while (chats.length > 20) chats.pop();
        localStorage.setItem('sp_chats', JSON.stringify(chats));
        localStorage.setItem('sp_msgs_' + currentChatId, JSON.stringify(chatMessages));
        renderHistory();
    }

    function renderHistory() {
        const chats = JSON.parse(localStorage.getItem('sp_chats') || '[]');
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        chats.forEach(c => {
            const btn = document.createElement('button');
            const isActive = String(c.id) === String(currentChatId);
            btn.className = 'history-item' + (isActive ? ' active' : '');
            const time = new Date(c.updated || Date.now()).toLocaleDateString('en', {month:'short', day:'numeric'});
            btn.dataset.chatId = String(c.id);
            const pin = c.pinned ? '&#128204; ' : '';
            btn.innerHTML = `<span class="hi-title">${pin}${esc(c.title || 'Chat')}</span><span class="hi-meta">${time}</span>`;
            btn.onclick = (e) => { e.stopPropagation(); loadChat(String(c.id), c.title); };
            list.appendChild(btn);
        });
    }

    function loadChat(chatId, title) {
        const targetId = String(chatId);
        // Save current
        if (chatMessages.length > 0 && currentChatId) {
            localStorage.setItem('sp_msgs_' + currentChatId, JSON.stringify(chatMessages));
        }
        currentChatId = targetId;

        // Find chat data
        const chats = JSON.parse(localStorage.getItem('sp_chats') || '[]');
        const targetChat = chats.find(c => String(c.id) === targetId);

        let savedMsgs = [];
        if (targetChat && Array.isArray(targetChat.messages) && targetChat.messages.length > 0) {
            savedMsgs = targetChat.messages;
            if (targetChat.lastCompany) lastCompany = targetChat.lastCompany;
        } else {
            try { savedMsgs = JSON.parse(localStorage.getItem('sp_msgs_' + targetId) || '[]'); } catch(e) {}
        }
        chatMessages = savedMsgs;

        // Clear & render
        msgEl.innerHTML = '';
        if (welcome) welcome.style.display = 'none';

        if (savedMsgs && savedMsgs.length > 0) {
            savedMsgs.forEach(m => {
                const role = m.role || 'bot';
                const msgText = m.text || m.reply || m.content || '';
                if (role === 'user') {
                    addMsg('user', msgText);
                } else {
                    const botDiv = document.createElement('div');
                    botDiv.className = 'msg msg-bot';
                    const rendered = (typeof marked !== 'undefined' && marked.parse) ? marked.parse(msgText) : esc(msgText);
                    botDiv.innerHTML = `<div class="msg-inner"><div class="bot-icon">&#9670;</div><div class="msg-content"><div class="msg-bubble rendered">${rendered}</div></div></div>`;
                    msgEl.appendChild(botDiv);
                }
            });
        } else if (title) {
            input.value = title;
            send();
        } else {
            if (welcome) welcome.style.display = 'flex';
        }

        // Active state
        document.querySelectorAll('.history-item').forEach(el => {
            el.classList.toggle('active', String(el.dataset.chatId) === targetId);
        });

        if (window.innerWidth <= 768) {
            const sb = document.getElementById('sidebar');
            if (sb) sb.classList.remove('open');
        }
        scroll();
        input.focus();
    }

    function newChat() {
        currentChatId = Date.now().toString();
        lastCompany = '';
        chatMessages = [];
        msgEl.innerHTML = '';
        if (welcome) welcome.style.display = 'flex';
        renderHistory();
        input.focus();
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }

    // Init
    renderHistory();
    </script>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <button onclick="pinChat()">&#128204; Pin chat</button>
        <button onclick="deleteChat()" class="delete">&#128465;&#65039; Delete chat</button>
    </div>

    <script>
    let contextChatId = null;
    const ctxMenu = document.getElementById('contextMenu');

    document.addEventListener('contextmenu', e => {
        const item = e.target.closest('.history-item');
        if (item) {
            e.preventDefault();
            contextChatId = item.dataset.chatId;
            ctxMenu.style.display = 'block';
            ctxMenu.style.left = e.pageX + 'px';
            ctxMenu.style.top = e.pageY + 'px';
        }
    });
    document.addEventListener('click', () => { ctxMenu.style.display = 'none'; });

    function pinChat() {
        if (!contextChatId) return;
        const chats = JSON.parse(localStorage.getItem('sp_chats') || '[]');
        const chat = chats.find(c => c.id === contextChatId);
        if (chat) {
            chat.pinned = !chat.pinned;
            chats.sort((a,b) => (b.pinned?1:0) - (a.pinned?1:0));
            localStorage.setItem('sp_chats', JSON.stringify(chats));
            renderHistory();
        }
        ctxMenu.style.display = 'none';
    }

    function deleteChat() {
        if (!contextChatId) return;
        const chats = JSON.parse(localStorage.getItem('sp_chats') || '[]');
        const idx = chats.findIndex(c => c.id === contextChatId);
        if (idx >= 0) {
            chats.splice(idx, 1);
            localStorage.setItem('sp_chats', JSON.stringify(chats));
            renderHistory();
            if (contextChatId === currentChatId) newChat();
        }
        ctxMenu.style.display = 'none';
    }
    </script>
</body>
</html>
