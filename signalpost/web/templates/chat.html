<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signalpost AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/chat.css">
</head>
<body>
    <div class="app">
        <div class="chat-area">
            <div class="chat-scroll" id="chat-scroll">
                <!-- Welcome -->
                <div class="welcome" id="welcome">
                    <div class="welcome-logo">◆</div>
                    <h1 class="welcome-title">Signalpost AI</h1>
                    <p class="welcome-sub">Ask me about any company in the world</p>

                    <div class="suggestions" id="suggestions">
                        <button onclick="ask('Tell me about OpenAI')">
                            <span class="sg-icon">🤖</span>
                            <span class="sg-text">Tell me about OpenAI</span>
                        </button>
                        <button onclick="ask('What is NVIDIA?')">
                            <span class="sg-icon">💻</span>
                            <span class="sg-text">What is NVIDIA?</span>
                        </button>
                        <button onclick="ask('Tell me about TCS')">
                            <span class="sg-icon">🏢</span>
                            <span class="sg-text">Tell me about TCS</span>
                        </button>
                        <button onclick="ask('Equinor company details')">
                            <span class="sg-icon">⛽</span>
                            <span class="sg-text">Equinor company details</span>
                        </button>
                        <button onclick="ask('Show IT & Software sector')">
                            <span class="sg-icon">📊</span>
                            <span class="sg-text">Show IT & Software sector</span>
                        </button>
                        <button onclick="ask('Tell me about Anthropic')">
                            <span class="sg-icon">🧠</span>
                            <span class="sg-text">Tell me about Anthropic</span>
                        </button>
                    </div>
                </div>

                <!-- Messages will be added here -->
                <div id="messages"></div>
            </div>

            <!-- Input -->
            <div class="input-area">
                <div class="input-box">
                    <div class="autocomplete-list" id="autocomplete"></div>
                    <textarea id="input" rows="1" placeholder="Ask about any company..." autofocus></textarea>
                    <button class="send" onclick="send()" id="sendBtn" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </div>
                <p class="input-hint">Signalpost AI knows 33+ global companies and 53,000+ Norwegian companies</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
    const input = document.getElementById('input');
    const messagesEl = document.getElementById('messages');
    const scrollEl = document.getElementById('chat-scroll');
    const welcome = document.getElementById('welcome');
    const sendBtn = document.getElementById('sendBtn');
    const acList = document.getElementById('autocomplete');

    // Auto-resize textarea
    input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 150) + 'px';
        sendBtn.disabled = !input.value.trim();
        // Autocomplete
        clearTimeout(window._acTimer);
        window._acTimer = setTimeout(doAutocomplete, 200);
    });

    input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        if (e.key === 'Escape') { acList.innerHTML = ''; acList.style.display = 'none'; }
    });

    async function doAutocomplete() {
        const q = input.value.trim();
        if (q.length < 2) { acList.style.display = 'none'; return; }
        try {
            const data = await fetch(`/api/suggest?q=${encodeURIComponent(q)}`).then(r=>r.json());
            if (!data.length) { acList.style.display = 'none'; return; }
            acList.innerHTML = '';
            data.forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'ac-item';
                const icon = s.type === 'global' ? '🌍' : '🇳🇴';
                btn.innerHTML = `<span>${icon} <strong>${s.name}</strong></span><span class="ac-sub">${s.sub}</span>`;
                btn.onclick = () => { input.value = s.name; acList.style.display = 'none'; send(); };
                acList.appendChild(btn);
            });
            acList.style.display = 'block';
        } catch(e) { acList.style.display = 'none'; }
    }

    function ask(text) { input.value = text; send(); }

    async function send() {
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        input.style.height = 'auto';
        sendBtn.disabled = true;
        acList.style.display = 'none';

        if (welcome) welcome.style.display = 'none';

        // User message
        const userDiv = document.createElement('div');
        userDiv.className = 'msg msg-user';
        userDiv.innerHTML = `<div class="msg-inner"><div class="msg-bubble">${esc(text)}</div></div>`;
        messagesEl.appendChild(userDiv);
        scroll();

        // Bot typing
        const botDiv = document.createElement('div');
        botDiv.className = 'msg msg-bot';
        botDiv.innerHTML = `<div class="msg-inner"><div class="bot-icon">◆</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>`;
        messagesEl.appendChild(botDiv);
        scroll();

        try {
            const resp = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: text}),
            });
            const data = await resp.json();
            const bubble = botDiv.querySelector('.msg-bubble');
            const html = marked.parse(data.reply || 'Sorry, I could not process that.');
            bubble.innerHTML = html;
            bubble.classList.add('rendered');
        } catch(err) {
            botDiv.querySelector('.msg-bubble').innerHTML = '❌ Connection error. Please try again.';
        }
        scroll();
    }

    function scroll() { setTimeout(() => scrollEl.scrollTop = scrollEl.scrollHeight, 50); }
    function esc(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

    // Hide autocomplete on click outside
    document.addEventListener('click', e => {
        if (!e.target.closest('.input-box')) { acList.style.display = 'none'; }
    });
    </script>
</body>
</html>
