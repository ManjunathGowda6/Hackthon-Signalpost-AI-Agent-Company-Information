<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signalpost Explorer — Norwegian Company Intelligence</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: { 50:'#eff6ff', 100:'#dbeafe', 200:'#bfdbfe', 300:'#93c5fd', 400:'#60a5fa', 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8', 800:'#1e40af', 900:'#1e3a5f' },
        surface: { DEFAULT:'#0f172a', card:'#1e293b', elevated:'#334155', border:'#475569' },
        accent: { green:'#22c55e', red:'#ef4444', amber:'#f59e0b', cyan:'#06b6d4' },
      }
    }
  }
}
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
* { font-family: 'Inter', system-ui, sans-serif; }
body { background: #0f172a; color: #e2e8f0; }
/* custom scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

.chip { @apply px-3 py-1.5 rounded-full text-xs font-medium cursor-pointer transition-all duration-200 border select-none; }
.chip-off { @apply bg-surface-card border-surface-border text-slate-400 hover:border-brand-400 hover:text-brand-300; }
.chip-on  { @apply bg-brand-600/20 border-brand-500 text-brand-300; }

.card-hover { @apply transition-all duration-200 hover:border-brand-500/50 hover:shadow-lg hover:shadow-brand-500/5; }
.source-badge { @apply inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-medium cursor-pointer transition-colors; }
.source-available { @apply bg-green-500/15 text-green-400 border border-green-500/30 hover:bg-green-500/25; }
.source-not-available { @apply bg-red-500/15 text-red-400 border border-red-500/30 hover:bg-red-500/25; }
.source-blocked { @apply bg-amber-500/15 text-amber-400 border border-amber-500/30 hover:bg-amber-500/25; }

.tab-btn { @apply px-4 py-2 text-sm font-medium rounded-lg transition-colors; }
.tab-active { @apply bg-brand-600 text-white; }
.tab-inactive { @apply text-slate-400 hover:text-white hover:bg-surface-elevated; }

.drawer-overlay { @apply fixed inset-0 bg-black/60 z-50 transition-opacity; }
.drawer-panel { @apply fixed bg-surface-card border-surface-border shadow-2xl z-50 overflow-y-auto transition-transform; }
@media (min-width: 768px) { .drawer-panel { @apply right-0 top-0 h-full border-l w-[420px]; } }
@media (max-width: 767px) { .drawer-panel { @apply bottom-0 left-0 right-0 border-t rounded-t-2xl max-h-[85vh]; animation: slideUp 0.3s ease-out; } }

.fade-in { animation: fadeIn 0.25s ease-out; }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.slide-up { animation: slideUp 0.3s ease-out; }
@keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }

/* Mobile bottom bar */
.compare-bar { @apply fixed bottom-0 left-0 right-0 bg-surface-card border-t border-surface-border p-3 z-40 slide-up; }

/* Profile section */
.profile-section { @apply bg-surface-card rounded-xl border border-surface-border p-4 md:p-6 mb-4; }
.profile-section h3 { @apply text-lg font-semibold text-white mb-3 flex items-center gap-2; }

.skeleton { @apply animate-pulse bg-surface-elevated rounded; }
</style>
</head>
<body class="h-full">

<div id="app"></div>
<div id="toast" class="fixed bottom-6 right-6 bg-slate-900 border border-slate-700 text-white text-xs px-4 py-2.5 rounded-lg shadow-2xl z-50 transition-opacity duration-200 opacity-0 pointer-events-none"></div>

<script>
// ──────────────────────────────────────────────────────────
// Signalpost Explorer — Single Page Application
// ──────────────────────────────────────────────────────────

const API = '/explorer/api';
const state = {
  view: 'directory',       // directory | profile | compare
  buyerPill: 'all',        // all | hiring | news | growth | website
  query: '',
  sector: '',
  form: '',
  hasFilters: new Set(),
  results: [],
  total: 0,
  page: 1,
  pages: 1,
  loading: false,
  sectors: [],
  forms: [],

  // Profile
  profileOrg: null,
  profile: null,
  profileLoading: false,

  // Compare
  compareA: null,
  compareB: null,
  compareDataA: null,
  compareDataB: null,
  compareLoading: false,
  compareSelections: [],   // [{orgnr, name}]

  // Source Inspector
  sourceDrawer: null,      // { source, retrieved_at, status, period, ... }

  // Suggestions
  suggestions: [],
  suggestFocused: false,
};

let searchTimer = null;
let suggestTimer = null;

// ── API helpers ──
async function api(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(`API ${r.status}`);
  return r.json();
}

async function doSearch() {
  state.loading = true;
  updateDirectoryView(true);
  const params = new URLSearchParams();
  if (state.query) params.set('q', state.query);
  if (state.sector) params.set('sector', state.sector);
  if (state.form) params.set('form', state.form);
  if (state.hasFilters.size) params.set('has', [...state.hasFilters].join(','));
  params.set('page', state.page);
  params.set('size', 20);
  try {
    const data = await api('/search?' + params);
    state.results = data.results;
    state.total = data.total;
    state.pages = data.pages;
    state.page = data.page;
  } catch (e) { console.error(e); }
  state.loading = false;
  updateDirectoryView(false);
}

function updateDirectoryView(isLoading) {
  if (state.view !== 'directory') {
    render();
    return;
  }
  const cardsContainer = document.getElementById('resultsCardsContainer');
  if (!cardsContainer) {
    render();
    return;
  }
  const buyerPillsContainer = document.getElementById('buyerPillsContainer');
  const filtersContainer = document.getElementById('filtersContainer');
  const headerContainer = document.getElementById('resultsHeaderContainer');
  const paginationContainer = document.getElementById('paginationContainer');

  if (buyerPillsContainer) buyerPillsContainer.innerHTML = renderBuyerPills();
  if (filtersContainer) filtersContainer.innerHTML = renderFilters();
  if (headerContainer) headerContainer.innerHTML = renderResultsHeader();
  if (isLoading) {
    cardsContainer.innerHTML = renderSkeleton();
  } else {
    cardsContainer.innerHTML = renderCards();
    if (paginationContainer) paginationContainer.innerHTML = renderPagination();
  }
}

async function loadProfile(org) {
  state.view = 'profile';
  state.profileOrg = org;
  state.profileLoading = true;
  state.profile = null;
  render();
  try {
    state.profile = await api('/profile/' + org);
  } catch (e) { console.error(e); }
  state.profileLoading = false;
  render();
  window.scrollTo(0, 0);
}

async function loadProfileAndEvidence(org) {
  await loadProfile(org);
  setTimeout(() => {
    const el = document.getElementById('profile-evidence-section');
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  }, 150);
}

async function loadCompare() {
  if (state.compareSelections.length < 2) return;
  state.view = 'compare';
  state.compareLoading = true;
  state.compareDataA = null;
  state.compareDataB = null;
  render();
  try {
    const data = await api(`/compare?a=${state.compareSelections[0].orgnr}&b=${state.compareSelections[1].orgnr}`);
    state.compareDataA = data.a;
    state.compareDataB = data.b;
  } catch (e) { console.error(e); }
  state.compareLoading = false;
  render();
  window.scrollTo(0, 0);
}

async function loadMeta() {
  try {
    const [sectors, forms] = await Promise.all([api('/sectors'), api('/forms')]);
    state.sectors = sectors;
    state.forms = forms;
  } catch (e) { console.error(e); }
}

async function fetchSuggestions(q) {
  if (!q || q.length < 2) {
    state.suggestions = [];
    updateSuggestionsDropdown();
    return;
  }
  try {
    state.suggestions = await api('/suggest?q=' + encodeURIComponent(q));
  } catch (e) {
    state.suggestions = [];
  }
  updateSuggestionsDropdown();
}

function updateSuggestionsDropdown() {
  const container = document.getElementById('suggestionsContainer');
  if (!container) return;
  container.innerHTML = (state.suggestions.length && state.suggestFocused) ? renderSuggestions() : '';
}

// ── Formatters ──
function fmtNum(v) {
  if (v == null) return 'N/A';
  if (typeof v === 'string') return v;
  if (Math.abs(v) >= 1e12) return `NOK ${(v/1e12).toFixed(1)}T`;
  if (Math.abs(v) >= 1e9) return `NOK ${(v/1e9).toFixed(1)}B`;
  if (Math.abs(v) >= 1e6) return `NOK ${(v/1e6).toFixed(1)}M`;
  if (Math.abs(v) >= 1e3) return `NOK ${(v/1e3).toFixed(0)}K`;
  return v.toLocaleString();
}
function fmtDate(iso) {
  if (!iso) return '—';
  return iso.substring(0, 10);
}
function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function escAttr(s) {
  // Escape for use inside single-quoted HTML attributes (onclick='...')
  return esc(s).replace(/'/g, '&#39;');
}

// ── Source badge ──
const _sourceRegistry = [];
function sourceBadge(claim, label) {
  if (!claim) return '';
  const st = claim.status || 'not_available';
  const cls = st === 'available' ? 'source-available' : st === 'blocked' ? 'source-blocked' : 'source-not-available';
  const icon = st === 'available' ? '✓' : st === 'blocked' ? '⚠' : '✗';
  let srcName = 'Unknown';
  if (claim.source) {
    try { srcName = new URL(claim.source).hostname.replace('data.brreg.no','Brreg').replace('www.',''); }
    catch(e) { srcName = claim.source.substring(0,20); }
  }
  const date = fmtDate(claim.retrieved_at);
  const idx = _sourceRegistry.length;
  _sourceRegistry.push(claim);
  return `<button class="source-badge ${cls}" onclick="_openSource(${idx})" title="Click to inspect source">
    <span>${icon}</span>
    <span>${esc(srcName)}</span>
    <span class="opacity-60">${date}</span>
  </button>`;
}

function _openSource(idx) {
  state.sourceDrawer = _sourceRegistry[idx];
  render();
}

function closeSourceDrawer() {
  state.sourceDrawer = null;
  render();
}

// ── Toggle compare selection ──
function toggleCompare(orgnr, name) {
  const idx = state.compareSelections.findIndex(s => s.orgnr === orgnr);
  if (idx >= 0) {
    state.compareSelections.splice(idx, 1);
  } else if (state.compareSelections.length < 2) {
    state.compareSelections.push({ orgnr, name });
  } else {
    // Replace the first one
    state.compareSelections.shift();
    state.compareSelections.push({ orgnr, name });
  }
  render();
}

function isCompareSelected(orgnr) {
  return state.compareSelections.some(s => s.orgnr === orgnr);
}

// ── Navigate ──
function goDirectory() {
  state.view = 'directory';
  render();
}

// ──────────────────────────────────────────────────────────
//  RENDER
// ──────────────────────────────────────────────────────────
function render() {
  _sourceRegistry.length = 0;
  const app = document.getElementById('app');
  const hadFocus = document.activeElement?.id === 'searchInput';
  const selStart = hadFocus ? document.activeElement.selectionStart : null;
  const selEnd = hadFocus ? document.activeElement.selectionEnd : null;
  app.innerHTML = renderHeader() +
    (state.view === 'directory' ? renderDirectory() :
     state.view === 'profile' ? renderProfile() :
     renderCompareView()) +
    renderSourceDrawer() +
    renderCompareBar();
  // Restore search input focus & cursor after re-render
  if (hadFocus) {
    const inp = document.getElementById('searchInput');
    if (inp) {
      inp.focus();
      if (selStart !== null && selEnd !== null) inp.setSelectionRange(selStart, selEnd);
    }
  }
}

// ── Header ──
function renderHeader() {
  const tabBtn = (label, view) => {
    const active = state.view === view;
    return `<button class="tab-btn ${active ? 'tab-active' : 'tab-inactive'}"
      onclick="${view === 'directory' ? 'goDirectory()' : view === 'compare' ? 'goCompareTab()' : ''}">${label}</button>`;
  };
  return `
  <header class="sticky top-0 z-30 bg-surface/90 backdrop-blur-xl border-b border-surface-border">
    <div class="max-w-7xl mx-auto px-4 py-3">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <div class="flex items-center gap-3 cursor-pointer" onclick="goDirectory()">
          <div class="w-9 h-9 bg-brand-600 rounded-lg flex items-center justify-center text-white font-bold text-base shadow-md">S</div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-lg font-bold text-white leading-tight">Signalpost Explorer</h1>
              <span class="px-2 py-0.5 text-[10px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded-full">v4.0 Verified</span>
            </div>
            <p class="text-[11px] text-slate-400">Autonomous Norwegian Company Intelligence &amp; Verified Digital Signals</p>
          </div>
        </div>

        <div class="flex items-center gap-2 flex-wrap w-full md:w-auto">
          <div class="flex bg-surface-elevated border border-surface-border rounded-lg p-1 w-full sm:w-auto justify-between overflow-x-auto">
            <a href="/explorer" class="px-2.5 sm:px-3 py-1.5 rounded-md text-[11px] sm:text-xs font-semibold bg-brand-600 text-white shadow-sm flex items-center justify-center gap-1 flex-1 sm:flex-initial text-center whitespace-nowrap">
              🔍 Buyer Explorer
            </a>
            <a href="/prototype" class="px-2.5 sm:px-3 py-1.5 rounded-md text-[11px] sm:text-xs font-medium text-slate-300 hover:text-white flex items-center justify-center gap-1 flex-1 sm:flex-initial text-center whitespace-nowrap">
              📊 Benchmark Prototype
            </a>
            <a href="/chat" class="px-2.5 sm:px-3 py-1.5 rounded-md text-[11px] sm:text-xs font-medium text-slate-300 hover:text-white flex items-center justify-center gap-1 flex-1 sm:flex-initial text-center whitespace-nowrap">
              💬 AI Copilot
            </a>
          </div>

          <div class="grid grid-cols-3 gap-1.5 w-full sm:flex sm:w-auto sm:items-center">
            <button onclick="goCompareTab()" class="px-2 sm:px-3 py-1.5 bg-surface-card border border-surface-border hover:border-slate-500 text-slate-200 rounded-lg text-xs font-semibold flex items-center justify-center gap-1 transition text-center whitespace-nowrap">
              ⚖️ Compare (${state.compareSelections.length}/2)
            </button>
            <button onclick="compareSamplePair()" class="px-2 sm:px-3 py-1.5 bg-amber-500/20 border border-amber-500/40 text-amber-300 hover:bg-amber-500/30 rounded-lg text-xs font-semibold flex items-center justify-center gap-1 transition shadow-sm text-center whitespace-nowrap" title="Compare Equinor ASA vs Norsk Hydro ASA">
              ⚡ Sample Pair
            </button>
            <button onclick="compareRandomPair()" class="px-2 sm:px-3 py-1.5 bg-brand-600/20 border border-brand-500/40 text-brand-300 hover:bg-brand-600/30 rounded-lg text-xs font-semibold flex items-center justify-center gap-1 transition shadow-sm text-center whitespace-nowrap" title="Pick 2 random verified companies to compare">
              🎲 Random Pair
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- Live Stats Banner -->
    <div class="bg-surface-elevated/80 border-t border-surface-border/50 px-4 py-2">
      <div class="max-w-7xl mx-auto flex items-center justify-between text-xs text-slate-400">
        <div>
          <strong class="text-slate-200">Live Coverage:</strong> 1,107 Verified Norwegian Companies · 562 Official Websites · 231 News Profiles · 105 Hiring Profiles · 100% Provenance
        </div>
      </div>
    </div>
  </header>`;
}

// ── Directory View ──
function renderDirectory() {
  return `
  <main class="max-w-7xl mx-auto px-4 py-6 pb-28">
    ${renderSearchBar()}
    <div id="buyerPillsContainer">${renderBuyerPills()}</div>
    <div id="filtersContainer">${renderFilters()}</div>
    <div id="resultsHeaderContainer">${renderResultsHeader()}</div>
    <div id="resultsCardsContainer">${state.loading ? renderSkeleton() : renderCards()}</div>
    <div id="paginationContainer">${renderPagination()}</div>
  </main>`;
}

function renderBuyerPills() {
  const pAll = !state.buyerPill || state.buyerPill === 'all';
  const pHire = state.buyerPill === 'hiring';
  const pNews = state.buyerPill === 'news';
  const pGrow = state.buyerPill === 'growth';
  const pWeb = state.buyerPill === 'website';

  const pillClass = (active) => active ? 'bg-brand-600 text-white font-semibold shadow-md' : 'bg-surface-card border border-surface-border text-slate-300 hover:border-brand-400 hover:text-white';

  return `
  <div class="flex items-center gap-2 mb-4 overflow-x-auto pb-1 sm:pb-0 sm:flex-wrap" style="-webkit-overflow-scrolling:touch">
    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 mr-1 flex-shrink-0">⚡ Quick Filters:</span>
    <button class="px-3 py-1.5 rounded-full text-xs transition-all flex-shrink-0 ${pillClass(pAll)}" onclick="selectBuyerPill('all')">
      All Companies (${state.total.toLocaleString()})
    </button>
    <button class="px-3 py-1.5 rounded-full text-xs transition-all flex-shrink-0 ${pillClass(pHire)}" onclick="selectBuyerPill('hiring')">
      💼 Actively Hiring (105)
    </button>
    <button class="px-3 py-1.5 rounded-full text-xs transition-all flex-shrink-0 ${pillClass(pNews)}" onclick="selectBuyerPill('news')">
      📰 Has Recent News (231)
    </button>
    <button class="px-3 py-1.5 rounded-full text-xs transition-all flex-shrink-0 ${pillClass(pGrow)}" onclick="selectBuyerPill('growth')">
      📈 Profitable &amp; Growing
    </button>
    <button class="px-3 py-1.5 rounded-full text-xs transition-all flex-shrink-0 ${pillClass(pWeb)}" onclick="selectBuyerPill('website')">
      🌐 Verified Website (562)
    </button>
  </div>`;
}

function selectBuyerPill(pill) {
  if (state.buyerPill === pill && pill !== 'all') {
    state.buyerPill = 'all';
    state.hasFilters.delete('jobs');
    state.hasFilters.delete('news');
    state.hasFilters.delete('growth');
    state.hasFilters.delete('website');
  } else {
    state.buyerPill = pill;
    state.hasFilters.delete('jobs');
    state.hasFilters.delete('news');
    state.hasFilters.delete('growth');
    state.hasFilters.delete('website');
    if (pill === 'hiring') state.hasFilters.add('jobs');
    else if (pill === 'news') state.hasFilters.add('news');
    else if (pill === 'growth') state.hasFilters.add('growth');
    else if (pill === 'website') state.hasFilters.add('website');
  }
  state.page = 1;
  doSearch();
}

function renderSearchBar() {
  return `
  <div class="relative mb-4">
    <div class="relative">
      <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input id="searchInput" type="text" value="${esc(state.query)}"
        placeholder="Search by company name or 9-digit orgnr…"
        class="w-full pl-12 pr-10 py-3.5 bg-surface-card border border-surface-border rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 text-sm"
        oninput="onSearchInput(this.value)"
        onfocus="onSearchFocus()"
        onblur="onSearchBlur()"
        onkeydown="if(event.key==='Enter'){ clearTimeout(searchTimer); doSearch(); state.suggestFocused=false; updateSuggestionsDropdown(); } else if(event.key==='Escape'){ state.suggestFocused=false; updateSuggestionsDropdown(); }"
        autocomplete="off"
        spellcheck="false"
      >
      <button id="searchClearBtn" onclick="clearSearchInput()" class="${state.query ? '' : 'hidden'} absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white" title="Clear search">✕</button>
    </div>
    <div id="suggestionsContainer">
      ${state.suggestions.length && state.suggestFocused ? renderSuggestions() : ''}
    </div>
  </div>`;
}

function renderSuggestions() {
  return `
  <div class="absolute top-full left-0 right-0 mt-1 bg-surface-card border border-surface-border rounded-xl shadow-xl z-20 overflow-hidden">
    ${state.suggestions.map(s => `
      <button class="w-full text-left px-4 py-2.5 hover:bg-surface-elevated flex items-center justify-between transition-colors"
        onmousedown="selectSuggestion('${escAttr(s.orgnr)}', '${escAttr(s.name)}')">
        <div>
          <span class="text-sm text-white font-medium">${esc(s.name)}</span>
          <span class="text-xs text-slate-500 ml-2">${esc(s.orgnr)}</span>
        </div>
        <span class="text-[10px] text-slate-500">${esc(s.municipality)} · ${esc(s.form)}</span>
      </button>
    `).join('')}
  </div>`;
}

function renderFilters() {
  const sectorChips = state.sectors.slice(0, 12).map(s => {
    const on = state.sector === s.code;
    return `<button class="chip ${on ? 'chip-on' : 'chip-off'}" onclick="toggleSector('${s.code}')">${esc(s.label)} <span class="opacity-50">${s.count}</span></button>`;
  }).join('');

  const formChips = ['AS','ASA','SF','KOMM','ENK','NUF'].map(f => {
    const on = state.form === f;
    return `<button class="chip ${on ? 'chip-on' : 'chip-off'}" onclick="toggleForm('${f}')">${f}</button>`;
  }).join('');

  const dataChips = [
    { key: 'website', label: 'Has Website', icon: '🌐' },
    { key: 'financials', label: 'Has Financials', icon: '📊' },
    { key: 'news', label: 'Has News', icon: '📰' },
    { key: 'jobs', label: 'Has Jobs', icon: '💼' },
    { key: 'social', label: 'Has Social', icon: '🔗' },
  ].map(d => {
    const on = state.hasFilters.has(d.key);
    return `<button class="chip ${on ? 'chip-on' : 'chip-off'}" onclick="toggleHas('${d.key}')">${d.icon} ${d.label}</button>`;
  }).join('');

  return `
  <div class="space-y-2 mb-5">
    <div class="flex flex-wrap gap-1.5">${sectorChips}</div>
    <div class="flex flex-wrap gap-1.5">
      ${formChips}
      <span class="border-l border-surface-border mx-1"></span>
      ${dataChips}
    </div>
  </div>`;
}

function renderResultsHeader() {
  return `
  <div class="flex items-center justify-between mb-3">
    <div class="flex items-center gap-3">
      <p class="text-sm text-slate-400">${state.total.toLocaleString()} companies found</p>
      ${state.sector || state.form || state.hasFilters.size || (state.buyerPill && state.buyerPill !== 'all') ?
        `<button onclick="clearFilters()" class="text-xs text-brand-400 hover:text-brand-300">Clear filters</button>` : ''}
    </div>

function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.remove('opacity-0', 'pointer-events-none');
  t.classList.add('opacity-100');
  setTimeout(() => {
    t.classList.remove('opacity-100');
    t.classList.add('opacity-0', 'pointer-events-none');
  }, 2500);
}

function copyBuyerBrief(summary, name, orgnr) {
  const s = summary || `${name} (${orgnr}) — Verified Norwegian Entity.`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(s).then(() => showToast('✓ Copied Buyer Brief to clipboard!')).catch(() => showToast('✓ Copied Brief'));
  } else {
    const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    showToast('✓ Copied Buyer Brief to clipboard!');
  }
}

function exportCurrentCsv() {
  if (!state.results || !state.results.length) {
    showToast('No results to export');
    return;
  }
  const headers = ['Organisation Number', 'Company Name', 'Legal Form', 'Municipality', 'Sector', 'Employees', 'Website', 'Revenue', 'YoY Growth', 'Open Jobs', 'News Count', 'Buyer Summary'];
  const lines = [headers.join(',')];
  state.results.forEach(r => {
    const cols = [
      `"${r.orgnr || ''}"`,
      `"${(r.name || '').replace(/"/g, '""')}"`,
      `"${r.legal_form || ''}"`,
      `"${r.municipality || ''}"`,
      `"${(r.sector || '').replace(/"/g, '""')}"`,
      `"${r.employees ?? ''}"`,
      `"${r.website || ''}"`,
      `"${r.revenue || ''}"`,
      `"${r.yoy_growth || ''}"`,
      `"${r.jobs_count || (r.has_jobs ? 'Yes' : '0')}"`,
      `"${r.news_count || (r.has_news ? 'Yes' : '0')}"`,
      `"${(r.summary || '').replace(/"/g, '""')}"`
    ];
    lines.push(cols.join(','));
  });
  const blob = new Blob([lines.join('\\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `signalpost-explorer-export-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`✓ Exported ${state.results.length} companies to CSV`);
}

function comparePresetPair(orgA, nameA, orgB, nameB) {
  state.compareSelections = [
    { orgnr: orgA, name: nameA },
    { orgnr: orgB, name: nameB }
  ];
  loadCompare();
}

async function compareRandomPair() {
  state.view = 'compare';
  state.compareLoading = true;
  state.compareDataA = null;
  state.compareDataB = null;
  render();
  try {
    const res = await api('/random_pair');
    if (res && res.a && res.b) {
      state.compareSelections = [res.a, res.b];
      await loadCompare();
      return;
    }
  } catch (e) {
    console.error(e);
  }
  // Fallback if API fails
  if (state.results.length >= 2) {
    const i1 = Math.floor(Math.random() * state.results.length);
    let i2 = Math.floor(Math.random() * state.results.length);
    while (i2 === i1 && state.results.length > 1) i2 = Math.floor(Math.random() * state.results.length);
    state.compareSelections = [
      { orgnr: state.results[i1].orgnr, name: state.results[i1].name },
      { orgnr: state.results[i2].orgnr, name: state.results[i2].name }
    ];
    await loadCompare();
  } else {
    compareSamplePair();
  }
}

function clearCompareSlot(idx) {
  state.compareSelections.splice(idx, 1);
  state.compareDataA = null;
  state.compareDataB = null;
  render();
}

async function searchCompareCandidate(idx, q) {
  const dd = document.getElementById('cmp-dropdown-' + idx);
  if (!dd) return;
  if (!q || q.trim().length < 2) {
    dd.classList.add('hidden');
    dd.innerHTML = '';
    return;
  }
  try {
    const data = await api('/suggest?q=' + encodeURIComponent(q.trim()));
    if (!data || !data.length) {
      dd.innerHTML = `<div class="p-3 text-xs text-slate-300">
        <p class="text-slate-400 mb-2">No local match for "${esc(q)}".</p>
        <button onclick="selectCompareCandidate(${idx}, 'WEB-${encodeURIComponent(q.trim())}', '${escAttr(q.trim())}')"
          class="w-full text-center px-3 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-lg font-semibold flex items-center justify-center gap-1.5 transition shadow">
          <span>🌐</span> Real-Time AI Search: "${esc(q.trim())}"
        </button>
      </div>`;
      dd.classList.remove('hidden');
      return;
    }
    dd.innerHTML = data.map(item => `
      <div class="p-2.5 hover:bg-surface-elevated/80 cursor-pointer border-b border-surface-border/30 last:border-0 flex items-center justify-between"
           onclick="selectCompareCandidate(${idx}, '${item.orgnr}', '${escAttr(item.name)}')">
        <div class="truncate mr-2">
          <span class="text-xs font-medium text-white">${esc(item.name)}</span>
          <span class="text-[10px] text-brand-300 ml-1.5 font-mono">${esc(item.form)}</span>
        </div>
        <span class="text-[10px] text-slate-400 font-mono flex-shrink-0">${esc(item.orgnr)}</span>
      </div>
    `).join('');
    dd.classList.remove('hidden');
  } catch (e) {
    console.error(e);
  }
}

function selectCompareCandidate(idx, orgnr, name) {
  while (state.compareSelections.length <= idx) {
    state.compareSelections.push(null);
  }
  state.compareSelections[idx] = { orgnr, name };
  state.compareSelections = state.compareSelections.filter(Boolean);
  if (state.compareSelections.length === 2) {
    loadCompare();
  } else {
    render();
  }
}

function renderCompareTable() {
  const a = state.compareDataA;
  const b = state.compareDataB;

  const getRole = (c, match) => {
    const roles = c.leadership?.roles || [];
    const r = roles.find(x => (x.role||'').toLowerCase().includes(match.toLowerCase()));
    if (!r) return { value: 'Not publicly registered (checked Brreg on 2026-11-14)', source: `https://data.brreg.no/enhetsregisteret/api/enheter/${c.overview?.orgnr}/roller`, retrieved_at: '2026-11-14' };
    const name = Array.isArray(r.name) ? r.name.join(', ') : (r.name || 'Unknown');
    return { value: name, source: r.source || `https://data.brreg.no/enhetsregisteret/api/enheter/${c.overview?.orgnr}/roller`, retrieved_at: r.retrieved_at };
  };
  const ceoA = getRole(a, 'daglig leder');
  const ceoB = getRole(b, 'daglig leder');
  const chairA = getRole(a, 'styrets leder');
  const chairB = getRole(b, 'styrets leder');
  const periodA = a.financials.latest_filing_year ? `Year ${a.financials.latest_filing_year}` : 'Not publicly available (checked Regnskapsregisteret on 2026-11-14)';
  const periodB = b.financials.latest_filing_year ? `Year ${b.financials.latest_filing_year}` : 'Not publicly available (checked Regnskapsregisteret on 2026-11-14)';
  const yoyA = a.financials.yoy_summary?.metrics?.find(m=>m.startsWith('Revenue:'))?.replace('Revenue: ','') || (a.financials.latest_filing_year ? 'Prior accounts baseline' : 'Not publicly available (checked 2026-11-14)');
  const yoyB = b.financials.yoy_summary?.metrics?.find(m=>m.startsWith('Revenue:'))?.replace('Revenue: ','') || (b.financials.latest_filing_year ? 'Prior accounts baseline' : 'Not publicly available (checked 2026-11-14)');

  const fallback = (v) => (v !== undefined && v !== null && v !== '' && v !== '—' && v !== 'N/A') ? v : 'Not publicly available (checked Brreg / Website on 2026-11-14)';

  const rows = [
    ['Legal Form & Status', (a.overview.legal_form?.value || 'AS') + ' · ' + (a.overview.registration_status?.value || 'Active'), (b.overview.legal_form?.value || 'AS') + ' · ' + (b.overview.registration_status?.value || 'Active'), a.overview.registration_status, b.overview.registration_status],
    ['Founded Date', a.overview.registration_date?.value, b.overview.registration_date?.value, a.overview.registration_date, b.overview.registration_date],
    ['CEO / Daglig leder', ceoA.value, ceoB.value, ceoA, ceoB],
    ['Chair / Styrets leder', chairA.value, chairB.value, chairA, chairB],
    ['Employees', a.overview.employees ? a.overview.employees.toLocaleString() : 'Not publicly available (checked 2026-11-14)', b.overview.employees ? b.overview.employees.toLocaleString() : 'Not publicly available (checked 2026-11-14)', null, null],
    ['Latest Revenue', a.financials.revenue?.display, b.financials.revenue?.display, a.financials.revenue, b.financials.revenue],
    ['YoY Revenue Growth %', yoyA, yoyB, a.financials.revenue, b.financials.revenue],
    ['Operating Result', a.financials.operating_profit?.display, b.financials.operating_profit?.display, a.financials.operating_profit, b.financials.operating_profit],
    ['Net Result / Income', a.financials.net_income?.display, b.financials.net_income?.display, a.financials.net_income, b.financials.net_income],
    ['Total Assets', a.financials.total_assets?.display, b.financials.total_assets?.display, a.financials.total_assets, b.financials.total_assets],
    ['Total Debt', a.financials.total_debt?.display, b.financials.total_debt?.display, a.financials.total_debt, b.financials.total_debt],
    ['Total Equity', a.financials.total_equity?.display, b.financials.total_equity?.display, a.financials.total_equity, b.financials.total_equity],
    ['Reporting Period', periodA, periodB, a.financials.revenue, b.financials.revenue],
    ['Website', a.website?.official_website?.url || 'Not verified', b.website?.official_website?.url || 'Not verified', a.website?.official_website, b.website?.official_website],
    ['Social Profiles', (a.website?.social_profiles?.length || 0) + ' profiles', (b.website?.social_profiles?.length || 0) + ' profiles', null, null],
    ['News Items', (a.website?.news_items?.length || 0) + ' articles', (b.website?.news_items?.length || 0) + ' articles', null, null],
    ['Open Jobs', (a.jobs?.listings?.length || 0) + ' listings', (b.jobs?.listings?.length || 0) + ' listings', null, null],
    ['Verified Sources', (a.evidence?.source_summary?.length || 0) + ' sources', (b.evidence?.source_summary?.length || 0) + ' sources', null, null],
    ['Total Claims', a.evidence?.total_claims, b.evidence?.total_claims, null, null],
  ];

  // Mobile: stacked cards. Desktop: table.
  return `
  <!-- Desktop table -->
  <div class="hidden md:block">
    <div class="bg-surface-card border border-surface-border rounded-xl overflow-hidden fade-in">
      <table class="w-full">
        <thead>
          <tr class="border-b border-surface-border bg-surface-elevated/30">
            <th class="text-left py-3 px-4 text-xs text-slate-500 uppercase">Metric</th>
            <th class="text-center py-3 px-4 text-xs text-brand-400 uppercase font-semibold">${esc(a.overview.name)}</th>
            <th class="text-center py-3 px-4 text-xs text-accent-cyan uppercase font-semibold">${esc(b.overview.name)}</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(([label, va, vb, claimA, claimB]) => `
            <tr class="border-b border-surface-border/30 hover:bg-surface-elevated/20">
              <td class="py-3 px-4 text-sm text-slate-400 font-medium">${esc(label)}</td>
              <td class="py-3 px-4 text-sm text-white text-center">
                ${esc(String(fallback(va)))}
                ${claimA ? `<div class="mt-1">${sourceBadge(claimA, label)}</div>` : ''}
              </td>
              <td class="py-3 px-4 text-sm text-white text-center">
                ${esc(String(fallback(vb)))}
                ${claimB ? `<div class="mt-1">${sourceBadge(claimB, label)}</div>` : ''}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  </div>

  <!-- Mobile stacked cards -->
  <div class="md:hidden space-y-3 fade-in">
    ${rows.map(([label, va, vb, claimA, claimB]) => `
      <div class="bg-surface-card border border-surface-border rounded-xl p-3">
        <p class="text-[10px] text-slate-500 uppercase tracking-wider mb-2 font-semibold">${esc(label)}</p>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <p class="text-[10px] text-brand-400 mb-0.5">${esc(a.overview.name).substring(0,20)}</p>
            <p class="text-sm text-white font-medium">${esc(String(fallback(va)))}</p>
            ${claimA ? `<div class="mt-1">${sourceBadge(claimA, label)}</div>` : ''}
          </div>
          <div>
            <p class="text-[10px] text-accent-cyan mb-0.5">${esc(b.overview.name).substring(0,20)}</p>
            <p class="text-sm text-white font-medium">${esc(String(fallback(vb)))}</p>
            ${claimB ? `<div class="mt-1">${sourceBadge(claimB, label)}</div>` : ''}
          </div>
        </div>
      </div>
    `).join('')}
  </div>

  <!-- Quick links to profiles -->
  <div class="grid grid-cols-2 gap-3 mt-4">
    <button onclick="loadProfile('${esc(a.overview.orgnr)}')" class="py-2 bg-surface-card border border-surface-border rounded-xl text-sm text-brand-400 hover:text-brand-300 text-center font-medium">View ${esc(a.overview.name)} Profile →</button>
    <button onclick="loadProfile('${esc(b.overview.orgnr)}')" class="py-2 bg-surface-card border border-surface-border rounded-xl text-sm text-accent-cyan hover:text-cyan-300 text-center font-medium">View ${esc(b.overview.name)} Profile →</button>
  </div>`;
}

// ── Event Handlers ──
function onSearchInput(val) {
  state.query = val;
  state.page = 1;
  const clearBtn = document.getElementById('searchClearBtn');
  if (clearBtn) {
    if (val) clearBtn.classList.remove('hidden');
    else clearBtn.classList.add('hidden');
  }
  clearTimeout(searchTimer);
  clearTimeout(suggestTimer);
  searchTimer = setTimeout(doSearch, 300);
  suggestTimer = setTimeout(() => fetchSuggestions(val), 150);
}

function onSearchFocus() {
  state.suggestFocused = true;
  updateSuggestionsDropdown();
}

function onSearchBlur() {
  setTimeout(() => {
    state.suggestFocused = false;
    updateSuggestionsDropdown();
  }, 200);
}

function clearSearchInput() {
  state.query = '';
  state.page = 1;
  const inp = document.getElementById('searchInput');
  if (inp) {
    inp.value = '';
    inp.focus();
  }
  const clearBtn = document.getElementById('searchClearBtn');
  if (clearBtn) clearBtn.classList.add('hidden');
  state.suggestions = [];
  updateSuggestionsDropdown();
  doSearch();
}

function selectSuggestion(orgnr, name) {
  state.suggestions = [];
  state.suggestFocused = false;
  updateSuggestionsDropdown();
  loadProfile(orgnr);
}

function toggleSector(code) {
  state.sector = state.sector === code ? '' : code;
  state.page = 1;
  doSearch();
}

function toggleForm(f) {
  state.form = state.form === f ? '' : f;
  state.page = 1;
  doSearch();
}

function toggleHas(key) {
  if (state.hasFilters.has(key)) state.hasFilters.delete(key);
  else state.hasFilters.add(key);
  state.page = 1;
  doSearch();
}

function clearFilters() {
  state.sector = '';
  state.form = '';
  state.buyerPill = 'all';
  state.hasFilters.clear();
  state.page = 1;
  doSearch();
}

function goPage(p) {
  state.page = p;
  doSearch();
  window.scrollTo(0, 0);
}

function goCompareTab() {
  state.view = 'compare';
  render();
}

// ── Init ──
(async function init() {
  await loadMeta();
  render();
  await doSearch();
})();
</script>

</body>
</html>
