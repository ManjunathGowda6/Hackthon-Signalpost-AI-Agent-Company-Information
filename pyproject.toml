[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalpost"
version = "1.0.0"
description = "AI Agent that researches Norwegian companies from public sources"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "ManjunathGowda6", email = "manjunathd236@gmail.com"}
]

dependencies = [
    "httpx[http2]>=0.27.0",
    "pydantic>=2.7.0",
    "anthropic>=0.34.0",
    "trafilatura>=1.12.0",
    "extruct>=0.17.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pdfplumber>=0.11.0",
    "click>=8.1.0",
    "structlog>=24.4.0",
    "diskcache>=5.6.0",
    "tenacity>=8.5.0",
    "tqdm>=4.66.0",
    "aiofiles>=24.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
]
browser = [
    "playwright>=1.45.0",
]
watch = [
    "watchdog>=4.0.0",
]

[project.scripts]
signalpost = "signalpost.cli:main"

[tool.setuptools.packages.find]
include = ["signalpost*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
